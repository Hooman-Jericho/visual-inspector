name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev,serve]" --quiet

      - name: Lint (ruff)
        run: |
          uv run ruff check src/ tests/ scripts/
          uv run ruff format --check src/ tests/ scripts/

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Test (pytest)
        run: uv run pytest tests/ -v --tb=short --cov=src/visual_inspector
        env:
          DEVICE: cpu

      - name: Verify numbers (check_readme_numbers)
        run: uv run python scripts/check_readme_numbers.py

