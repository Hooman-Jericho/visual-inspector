[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-inspector"
version = "0.1.0"
description = "Unsupervised industrial defect detection with PatchCore (from scratch) on MVTec AD"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hooman Soleymani"}]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.9.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "faiss-cpu>=1.7.4",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]
serve = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
visual-inspector = "visual_inspector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_inspector"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
